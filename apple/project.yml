name: KnifeTerminal
options:
  bundleIdPrefix: com.cwandt
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    DEVELOPMENT_TEAM: L6DVQR8JB9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "1.0.3"  # CFBundleVersion must increase each release — Sparkle compares it

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  KnifeKit:
    path: KnifeKit

targets:
  KnifeMac:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Resources
        buildPhase: resources
      - path: Fonts
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
      - package: KnifeKit
    info:
      path: macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Knife Terminal
        CFBundleDisplayName: Knife Terminal
        CFBundleIconFile: icon
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        ATSApplicationFontsPath: "."
        NSAppleEventsUsageDescription: Knife Terminal opens folders and scripts you send it.
        NSHumanReadableCopyright: CW&T
        SUFeedURL: https://raw.githubusercontent.com/cheewee2000/knife-terminal/main/appcast.xml
        SUPublicEDKey: IsZ2LtddRqNHFHsp6U40Gw/A6sWIJO4m5xJYr1r4qic=
        SUEnableAutomaticChecks: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Shell Script
            CFBundleTypeRole: Shell
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.terminal.shell-script
              - public.shell-script
              - public.bash-script
              - public.zsh-script
              - public.unix-executable
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.folder
        CFBundleURLTypes:
          - CFBundleURLName: Remote shell
            CFBundleURLSchemes: [ssh, telnet, x-man-page]
    settings:
      base:
        PRODUCT_NAME: Knife Terminal
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.knifeterminal
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # entitlements files are maintained by hand (not xcodegen-generated):
        # Debug adds icloud-container-environment=Production so dev builds see
        # the same CloudKit data as App Store / notarized-release builds
        Debug:
          CODE_SIGN_ENTITLEMENTS: macOS/KnifeMac.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: macOS/KnifeMac.entitlements

  KnifeiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Fonts
        buildPhase: resources
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: KnifeKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Knife
        CFBundleDisplayName: Knife
        UILaunchScreen: {}
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - JetBrainsMono-Italic.ttf
          - JetBrainsMono-BoldItalic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Knife
        PRODUCT_BUNDLE_IDENTIFIER: com.cwandt.knifeterminal.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: iOS/KnifeiOS.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: iOS/KnifeiOS.entitlements

schemes:
  KnifeMac:
    build:
      targets: { KnifeMac: all }
  KnifeiOS:
    build:
      targets: { KnifeiOS: all }
