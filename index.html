<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Knife Terminal</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* dark theme: inverted ink/paper on warm neutrals (cerakote black) */
    :root { --accent: #B1A57E; --sidew: 220px; --attn: #18e038; }
    :root[data-theme="dark"] { --attn: #39ff14; --ink: #ececea; --ink-soft: #b9b8b3; --ink-faint: #8a8a8a; --rule: #2e2e2c; --paper: #111111; --paper-2: #1a1a18; --paper-3: #222220; }
    body { background: var(--paper); color: var(--ink); transition: background var(--dur) var(--ease); }
    #side { position: absolute; top: 0; bottom: 25px; left: 0; width: var(--sidew); background: var(--paper-2); border-right: 1px solid var(--rule); display: flex; flex-direction: column; user-select: none; font-size: 12px; }
    #drag { height: 36px; -webkit-app-region: drag; flex: none; }
    #collapse { color: var(--ink-soft); font-size: 13px; line-height: 1; cursor: default; transition: opacity var(--dur-fast) var(--ease); }
    #collapse:hover { opacity: 0.55; }
    .tab .emoji, .proj .emoji { flex: none; width: 16px; text-align: center; font-size: 12px; }
    .proj { display: flex; align-items: center; gap: 6px; }
    /* collapsed: 40px rail showing only the emoji of open tabs */
    body.collapsed #side { width: 40px; }
    body.collapsed #terms { left: 41px; }
    body.collapsed .label, body.collapsed #search, body.collapsed #projects { display: none; }
    body.collapsed #tabs { max-height: none; flex: 1; }
    body.collapsed .tab { padding: 7px 0; justify-content: center; gap: 0; position: relative; }
    body.collapsed .tab .emoji { width: auto; font-size: 16px; }
    body.collapsed .tab .title, body.collapsed .tab .close { display: none; }
    body.collapsed .tab.active { border-top-color: transparent; border-bottom-color: transparent; }
    .label { padding: 12px 12px 6px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); display: flex; justify-content: space-between; align-items: center; flex: none; }
    #tabs { flex: none; max-height: 40%; overflow-y: auto; }
    .tab { padding: 6px 12px; color: var(--ink-soft); cursor: default; display: flex; align-items: center; gap: 8px; transition: opacity var(--dur-fast) var(--ease); }
    .tab:hover { opacity: 0.55; }
    .tab.dragging { opacity: 0.3; }
    .tab.active { background: var(--paper); color: var(--ink); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-right: -1px; box-shadow: inset 2px 0 0 var(--accent); }
    .tab .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .dot { display: none; }
    .tab.attn, .tab.attn .close { color: var(--attn); text-shadow: 0 0 6px var(--attn); }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 3px var(--attn)) brightness(1.1); } 50% { filter: drop-shadow(0 0 10px var(--attn)) drop-shadow(0 0 18px var(--attn)) brightness(1.4); } }
    body.collapsed .tab.attn .emoji { animation: glow 1.4s ease-in-out infinite; }
    .tab .close { color: var(--ink-faint); font-size: 13px; }
    .tab.active .close { color: var(--ink); }
    #newtab { cursor: default; color: var(--ink); font-size: 14px; line-height: 1; transition: opacity var(--dur-fast) var(--ease); }
    #newtab:hover { opacity: 0.55; }
    #search { flex: none; margin: 0 12px 8px; width: calc(100% - 24px); box-sizing: border-box; padding: 5px 8px; font: inherit; font-size: 12px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 0; outline: none; }
    #search:focus { border-color: var(--accent); }
    #search::placeholder { color: var(--ink-faint); }
    .proj.hidden { display: none; }
    #projects { flex: 1; overflow-y: auto; border-top: 1px solid var(--rule); }
    .proj { padding: 5px 12px; color: var(--ink-soft); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity var(--dur-fast) var(--ease); }
    .proj:hover { opacity: 0.55; }
    #foot { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 12px; font-size: 10px; letter-spacing: 0.04em; color: var(--ink-faint); text-transform: uppercase; border-top: 1px solid var(--rule); background: var(--paper-2); user-select: none; }
    #foot .id { font-weight: 700; letter-spacing: 0.06em; color: var(--ink); text-transform: none; }
    #foot .id span { font-weight: 400; color: var(--ink-soft); margin-left: 8px; }
    #foot .sp { flex: 1; }
    #hooks { cursor: default; color: var(--ink-soft); transition: opacity var(--dur-fast) var(--ease); }
    #hooks:hover { opacity: 0.55; }
    #setdefault { cursor: default; color: var(--ink-soft); transition: opacity var(--dur-fast) var(--ease); }
    #setdefault:hover { opacity: 0.55; }
    #theme { cursor: default; color: var(--ink-soft); transition: opacity var(--dur-fast) var(--ease); }
    #theme:hover { opacity: 0.55; }
    #terms { position: absolute; top: 0; bottom: 25px; left: calc(var(--sidew) + 1px); right: 0; }
    #resizer { position: absolute; top: 0; bottom: 25px; left: calc(var(--sidew) - 2px); width: 5px; cursor: col-resize; z-index: 3; }
    #resizer:hover, body.resizing #resizer { background: var(--accent); opacity: 0.5; }
    body.resizing { cursor: col-resize; user-select: none; }
    body.resizing #terms { pointer-events: none; }
    body.collapsed #resizer { display: none; }
    #dragbar { position: absolute; top: 0; left: 0; right: 0; height: 14px; -webkit-app-region: drag; }
    .term { position: absolute; inset: 0; padding: 14px 0 4px 12px; display: none; }
    .term.active { display: block; }
    .term.over { outline: 2px solid var(--accent); outline-offset: -2px; }
  </style>
</head>
<body>
  <div id="side">
    <div id="drag"></div>
    <div class="label">Tabs <span id="newtab" title="New tab (⌘T)">+</span></div>
    <div id="tabs"></div>
    <div class="label">Claude Code projects</div>
    <input id="search" type="text" placeholder="search  ⌘K" spellcheck="false" autocomplete="off">
    <div id="projects"></div>
  </div>
  <div id="terms"><div id="dragbar"></div></div>
  <div id="resizer"></div>
  <div id="foot"><span id="collapse" title="Hide/show sidebar (⌘B)">‹</span><span class="id">CWT_STE3XM1_2607<span>KNIFE TERM</span></span><span class="sp"></span><span id="version">v0.8.2</span><span id="setdefault" title="Make Knife the default terminal">set default</span><span id="hooks" title="Claude Code attention alerts (dot + chime)">alerts</span><span id="theme" title="Theme">auto</span></div>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-serialize/lib/addon-serialize.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
