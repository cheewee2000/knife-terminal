<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Knife Terminal</title>
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* dark theme: inverted ink/paper on warm neutrals (cerakote black) */
    :root[data-theme="dark"] { --ink: #ececea; --ink-soft: #b9b8b3; --ink-faint: #8a8a8a; --rule: #2e2e2c; --paper: #111111; --paper-2: #1a1a18; --paper-3: #222220; }
    body { background: var(--paper); color: var(--ink); transition: background var(--dur) var(--ease); }
    #side { position: absolute; top: 0; bottom: 0; left: 0; width: 220px; background: var(--paper-2); border-right: 1px solid var(--rule); display: flex; flex-direction: column; user-select: none; font-size: 12px; }
    #drag { height: 40px; -webkit-app-region: drag; flex: none; }
    #mark { display: flex; align-items: baseline; gap: 6px; padding: 0 12px 12px; border-bottom: 1px solid var(--rule); flex: none; flex-wrap: wrap; }
    #mark b { font-weight: 700; letter-spacing: 0.06em; color: var(--ink); }
    #mark span { color: var(--ink-soft); letter-spacing: 0.02em; font-size: 11px; }
    .label { padding: 12px 12px 6px; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-faint); display: flex; justify-content: space-between; align-items: center; flex: none; }
    #tabs { flex: none; max-height: 40%; overflow-y: auto; }
    .tab { padding: 6px 12px; color: var(--ink-soft); cursor: default; display: flex; align-items: center; gap: 8px; transition: opacity var(--dur-fast) var(--ease); }
    .tab:hover { opacity: 0.55; }
    .tab.active { background: var(--paper); color: var(--ink); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-right: -1px; }
    .tab .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .dot { width: 7px; height: 7px; border-radius: var(--radius-pill); background: var(--signal-orange); display: none; flex: none; }
    .tab.attn .dot { display: block; }
    .tab .close { color: var(--ink-faint); font-size: 13px; }
    .tab.active .close { color: var(--ink); }
    #newtab { cursor: default; color: var(--ink); font-size: 14px; line-height: 1; transition: opacity var(--dur-fast) var(--ease); }
    #newtab:hover { opacity: 0.55; }
    #search { flex: none; margin: 0 12px 8px; width: calc(100% - 24px); box-sizing: border-box; padding: 5px 8px; font: inherit; font-size: 12px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 0; outline: none; }
    #search:focus { border-color: var(--ink); }
    #search::placeholder { color: var(--ink-faint); }
    .proj.hidden { display: none; }
    #projects { flex: 1; overflow-y: auto; border-top: 1px solid var(--rule); }
    .proj { padding: 5px 12px; color: var(--ink-soft); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity var(--dur-fast) var(--ease); }
    .proj:hover { opacity: 0.55; }
    .proj:before { content: '→ '; color: var(--ink-faint); }
    #foot { flex: none; display: flex; justify-content: space-between; padding: 8px 12px; font-size: 10px; letter-spacing: 0.04em; color: var(--ink-faint); text-transform: uppercase; border-top: 1px solid var(--rule); }
    #hooks { cursor: default; color: var(--ink-soft); transition: opacity var(--dur-fast) var(--ease); }
    #hooks:hover { opacity: 0.55; }
    #setdefault { cursor: default; color: var(--ink-soft); transition: opacity var(--dur-fast) var(--ease); }
    #setdefault:hover { opacity: 0.55; }
    #theme { cursor: default; color: var(--ink-soft); transition: opacity var(--dur-fast) var(--ease); }
    #theme:hover { opacity: 0.55; }
    #terms { position: absolute; top: 0; bottom: 0; left: 221px; right: 0; }
    #dragbar { position: absolute; top: 0; left: 0; right: 0; height: 14px; -webkit-app-region: drag; }
    .term { position: absolute; inset: 0; padding: 14px 0 4px 12px; display: none; }
    .term.active { display: block; }
    .term.over { outline: 2px solid var(--ink); outline-offset: -2px; }
  </style>
</head>
<body>
  <div id="side">
    <div id="drag"></div>
    <div id="mark"><b>KNIFE TERM</b></div>
    <div class="label">Tabs <span id="newtab" title="New tab (⌘T)">+</span></div>
    <div id="tabs"></div>
    <div class="label">Claude Code projects</div>
    <input id="search" type="text" placeholder="search  ⌘K" spellcheck="false" autocomplete="off">
    <div id="projects"></div>
    <div id="foot"><span id="version">v0.6.0</span><span id="setdefault" title="Make Knife the default terminal">set default</span><span id="hooks" title="Claude Code attention alerts (dot + chime)">alerts</span><span id="theme" title="Theme">auto</span></div>
  </div>
  <div id="terms"><div id="dragbar"></div></div>
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
